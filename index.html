<script>
(function(){
  function lg(){try{return localStorage.getItem('lum-lang')==='en'?'en':'ar';}catch(e){return 'ar';}}
  var T={ar:{badge:'\u062c\u062f\u064a\u062f',title:'\u0623\u064a \u0635\u0627\u0628\u0648\u0646\u0629 \u0641\u0631\u0639\u0648\u0646\u064a\u0629 \u062a\u0634\u0628\u0647\u0643\u061f',text:'\u062c\u0627\u0648\u0628 4 \u0623\u0633\u0626\u0644\u0629 \u0639\u0646 \u0630\u0648\u0642\u0643 \u0648\u0645\u0632\u0627\u062c\u0643 \u0648\u0627\u0643\u062a\u0634\u0641 \u0635\u0627\u0628\u0648\u0646\u062a\u0643 \u0645\u0646 \u0644\u0648\u0645\u064a\u0631\u0627',btn:'\u0627\u0628\u062f\u0623 \u0627\u0644\u0627\u062e\u062a\u0628\u0627\u0631'},
    en:{badge:'NEW',title:'Which Pharaonic soap matches you?',text:'Answer 4 questions about your taste and mood and discover your Lumiera soap',btn:'Start the quiz'}};
  var G=[['\u0645\u062c\u0645\u0648\u0639\u0629 \u0627\u0644\u0645\u0633\u0627\u062c','Massage Collection'],['\u0627\u0644\u0623\u0642\u0631\u0627\u0635 \u0627\u0644\u0645\u0644\u0643\u064a\u0629','Royal Rounds'],['\u0645\u062c\u0645\u0648\u0639\u0629 \u0627\u0644\u0623\u0634\u0643\u0627\u0644','Shapes Collection']];
  function groups(){
    var l=lg();
    document.querySelectorAll('.file-group-label').forEach(function(p){
      var t=p.textContent.trim();
      for(var i=0;i<G.length;i++){
        if(t===G[i][0]||t===G[i][1]){var w=l==='en'?G[i][1]:G[i][0];if(t!==w)p.textContent=w;}
      }
    });
  }
  var TM={ar:{badge:'\u062c\u062f\u064a\u062f',title:'\u0645\u062a\u062d\u0641 \u0644\u0648\u0645\u064a\u0631\u0627',text:'\u0627\u062a\u0641\u0631\u062c \u0639\u0644\u0649 \u0627\u0644\u0640 28 \u0635\u0627\u0628\u0648\u0646\u0629 \u0643\u0623\u0646\u0647\u0645 \u062a\u062d\u0641 \u0641\u064a \u0645\u062a\u062d\u0641\u060c \u0628\u0625\u0636\u0627\u0621\u0629 \u0630\u0647\u0628\u064a\u0629 \u0648\u0644\u0648\u062d\u0629 \u062a\u0639\u0631\u064a\u0641 \u0644\u0643\u0644 \u0642\u0637\u0639\u0629',btn:'\u0627\u062f\u062e\u0644 \u0627\u0644\u0645\u062a\u062d\u0641'},
    en:{badge:'NEW',title:'The LUMIERA Museum',text:'See all 28 soaps displayed like museum pieces, with gold lighting and a plaque for each one',btn:'Enter the museum'}};
  function insertMuseumBanner(){
    var hero=document.querySelector('.lum-hero');
    var d=document.getElementById('museum-promo');
    var l=lg();
    if(d){
      if(d.getAttribute('data-lg')!==l){
        var t=TM[l];d.setAttribute('data-lg',l);
        d.querySelector('.museum-promo-badge').textContent=t.badge;
        d.querySelector('.museum-promo-title').textContent=t.title;
        d.querySelector('.museum-promo-text').textContent=t.text;
        d.querySelector('.museum-promo-btn').textContent=t.btn;
        d.dir=l==='en'?'ltr':'rtl';
      }
      return;
    }
    if(!hero||!hero.parentNode) return;
    var t=TM[l];
    d=document.createElement('div');
    d.className='museum-promo'; d.id='museum-promo'; d.setAttribute('data-lg',l); d.dir=l==='en'?'ltr':'rtl';
    d.innerHTML='<span class="museum-promo-badge"></span><div class="museum-promo-title"></div><div class="museum-promo-text"></div><a class="museum-promo-btn" href="./museum.html"></a>';
    d.querySelector('.museum-promo-badge').textContent=t.badge;
    d.querySelector('.museum-promo-title').textContent=t.title;
    d.querySelector('.museum-promo-text').textContent=t.text;
    d.querySelector('.museum-promo-btn').textContent=t.btn;
    var q=document.getElementById('quiz-promo');
    if(q&&q.parentNode){q.parentNode.insertBefore(d,q.nextSibling);}
    else{hero.parentNode.insertBefore(d, hero.nextSibling);}
  }
  function insertQuizBanner(){
    var hero=document.querySelector('.lum-hero');
    var d=document.getElementById('quiz-promo');
    var l=lg();
    if(d){
      if(d.getAttribute('data-lg')!==l){
        var t=T[l];d.setAttribute('data-lg',l);
        d.querySelector('.quiz-promo-badge').textContent=t.badge;
        d.querySelector('.quiz-promo-title').textContent=t.title;
        d.querySelector('.quiz-promo-text').textContent=t.text;
        d.querySelector('.quiz-promo-btn').textContent=t.btn;
        d.dir=l==='en'?'ltr':'rtl';
      }
      return;
    }
    if(!hero||!hero.parentNode) return;
    var t=T[l];
    d=document.createElement('div');
    d.className='quiz-promo'; d.id='quiz-promo'; d.setAttribute('data-lg',l); d.dir=l==='en'?'ltr':'rtl';
    d.innerHTML='<span class="quiz-promo-badge"></span><div class="quiz-promo-title"></div><div class="quiz-promo-text"></div><a class="quiz-promo-btn" href="./quiz.html"></a>';
    d.querySelector('.quiz-promo-badge').textContent=t.badge;
    d.querySelector('.quiz-promo-title').textContent=t.title;
    d.querySelector('.quiz-promo-text').textContent=t.text;
    d.querySelector('.quiz-promo-btn').textContent=t.btn;
    hero.parentNode.insertBefore(d, hero.nextSibling);
  }
  function run(){insertQuizBanner();insertMuseumBanner();groups();}
  function start(){
    run();
    new MutationObserver(run).observe(document.body,{childList:true,subtree:true,characterData:true});
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start); else start();
})();
</script>
