<style>
  *{box-sizing:border-box}
  body{margin:0;background:#f6f7f1;color:#241f1c;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",sans-serif;min-height:100vh}
  .wrap{max-width:560px;margin-inline:auto;padding:16px 14px 32px}
  .hero{background:#f6f7f1;border:1px solid #c9a64c;border-radius:16px;text-align:center;padding:26px 16px 20px;margin:8px 0 14px}
  .emblem{width:84px;height:auto;margin-inline:auto;display:block}
  .brand{font-size:26px;letter-spacing:.22em;color:#a8832e;margin-top:10px;font-weight:600}
  .quiz-title{color:#a8832e;font-size:19px;font-weight:700;margin-top:10px}
  .quiz-sub{color:#585254;font-size:13.5px;margin-top:8px;line-height:1.8}
  .btn-gold{display:inline-block;background:#a8832e;color:#fff;border:none;border-radius:8px;padding:12px 34px;margin-top:16px;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit;text-decoration:none}
  .btn-gold:active{transform:scale(.98)}
  .btn-outline{display:inline-block;background:transparent;color:#a8832e;border:1px solid #a8832e;border-radius:8px;padding:10px 24px;margin-top:10px;font-weight:600;font-size:14px;cursor:pointer;font-family:inherit;text-decoration:none}

  .dot{width:34px;height:5px;border-radius:999px;background:#e6ddc4}
  .dot.on{background:#a8832e}
  .qcard{background:#fff;border:2px solid #c9a64c;border-radius:16px;padding:20px 14px 16px;text-align:center}
  .qstep{font-size:12px;color:#a8832e;font-weight:700;letter-spacing:1px}
  .qtext{font-size:18px;font-weight:700;margin:8px 0 14px}
  .opt{display:block;width:100%;background:#f6f7f1;border:1px solid #eae9ea;border-radius:12px;padding:13px 14px;margin-top:9px;font-size:14.5px;font-weight:600;color:#241f1c;cursor:pointer;font-family:inherit;transition:border-color .15s,background .15s}
  .opt:hover,.opt:focus-visible{border-color:#c9a64c;background:#fbf8ee;outline:none}
  .opt .emo{margin-inline-end:8px}
  .result{background:#fff;border:2px solid #c9a64c;border-radius:16px;padding:22px 14px 18px;text-align:center}
  .result-badge{display:inline-block;background:#a8832e;color:#fff;font-size:11px;font-weight:700;letter-spacing:1.5px;padding:3px 14px;border-radius:999px}
  .result-title{font-size:19px;font-weight:700;color:#a8832e;margin:12px 0 4px}
  .result-photo{width:100%;max-width:380px;display:block;margin:12px auto 0;border-radius:12px;border:1px solid #eee6d2}
  .result-name{font-size:20px;font-weight:700;margin-top:14px}
  .result-en{color:#585254;font-size:12px;margin-top:2px}
  .price{margin-top:10px}
  .price-old{text-decoration:line-through;text-decoration-thickness:1.5px;color:#7a6c50;font-weight:500;font-size:14px;margin-inline-end:8px}
  .price-new{color:#a8832e;font-weight:700;font-size:22px}
  .wf-note{color:#7a6c50;font-size:12px;margin-top:4px}
  .result-actions{margin-top:16px;display:flex;flex-direction:column;gap:2px;align-items:center}
  .share-hint{color:#585254;font-size:12px;margin-top:14px;line-height:1.7}
  .back-link{display:inline-block;margin-top:18px;color:#a8832e;font-size:13px;font-weight:600;text-decoration:none}
  .credit{margin-top:22px;text-align:center;font-size:11px;letter-spacing:.25em;color:#a8832e}
  .langbar{display:flex;justify-content:flex-end;margin:2px 0 6px}
  .lang-btn{background:#fff;color:#a8832e;border:1px solid #c9a64c;border-radius:999px;padding:6px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
  .fade{animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>

<script src="./assets/cart.js?v=4"></script>
<script>

const PRODUCTS = [

  {n:6,  ar:"قطعة مساج اللؤلؤ الأبيض", en:"White Pearl Massage Bar", price:129, color:["pearl"],       shape:["massage"], mood:["calm"]},
  {n:7,  ar:"قطعة مساج الفضة",         en:"Silver Massage Bar",      price:149, color:["pearl"],       shape:["massage"], mood:["royal"]},
  {n:8,  ar:"قطعة مساج اللؤلؤ",        en:"Pearl Massage Bar",       price:139, color:["pearl"],       shape:["massage"], mood:["calm"]},
  {n:9,  ar:"قطعة مساج الورد الفاتح",  en:"Soft Pink Massage Bar",   price:139, color:["pink"],        shape:["massage"], mood:["romantic"]},
  {n:10, ar:"قطعة مساج الذهب الأسود",  en:"Black Gold Massage Bar",  price:169, color:["gold","dark"], shape:["massage"], mood:["royal","night"]},
  {n:11, ar:"القرص الأخضر الملكي",     en:"Royal Green Round",       price:129, color:["green"],       shape:["round"],   mood:["royal","nature"]},
  {n:12, ar:"القرص الفضي",             en:"Silver Round",            price:139, color:["pearl"],       shape:["round"],   mood:["calm","royal"]},
  {n:13, ar:"قرص الزمرد",              en:"Emerald Round",           price:149, color:["green"],       shape:["round"],   mood:["nature"]},
  {n:14, ar:"القرص الفيروزي",          en:"Turquoise Round",         price:149, color:["blue"],        shape:["round"],   mood:["calm","nature"]},
  {n:15, ar:"قرص الماندالا الليلي",    en:"Night Mandala Round",     price:139, color:["dark"],        shape:["round"],   mood:["night"]},
  {n:16, ar:"القرص الرمادي المنقوش",   en:"Engraved Grey Round",     price:129, color:["dark","pearl"],shape:["round"],   mood:["calm","night"]},
  {n:17, ar:"القرص الأزرق الفاتح",     en:"Light Blue Round",        price:119, color:["blue"],        shape:["round"],   mood:["calm"]},
  {n:18, ar:"القرص الأزرق",            en:"Blue Oval",               price:129, color:["blue"],        shape:["round"],   mood:["calm"]},
  {n:19, ar:"بيضة الفراشة اللؤلؤية",   en:"Pearl Butterfly Oval",    price:119, color:["pearl"],       shape:["butterfly"],mood:["calm","romantic"]},
  {n:20, ar:"وردة اللؤلؤ الأبيض",      en:"White Pearl Rose",        price:129, color:["pearl"],       shape:["rose"],    mood:["romantic","calm"]},
  {n:21, ar:"الفراشة الفضية",          en:"Silver Butterfly",        price:139, color:["pearl"],       shape:["butterfly"],mood:["nature","romantic"]},
  {n:22, ar:"الفراشة الزرقاء",         en:"Blue Butterfly",          price:139, color:["blue"],        shape:["butterfly"],mood:["nature","calm"]},
  {n:23, ar:"الوردة الزرقاء",          en:"Blue Rose",               price:149, color:["blue"],        shape:["rose"],    mood:["romantic"]},
  {n:24, ar:"القلبان الأزرقان",        en:"Twin Blue Hearts",        price:159, color:["blue"],        shape:["hearts"],  mood:["romantic"]},
  {n:25, ar:"الوردة الذهبية",          en:"Golden Rose",             price:169, color:["gold"],        shape:["rose"],    mood:["royal","romantic"]},
  {n:26, ar:"قرص النحلة الذهبي",       en:"Golden Bee Oval",         price:179, color:["gold"],        shape:["unique"],  mood:["royal","nature"]},
  {n:27, ar:"الوردة الوردية اللؤلؤية", en:"Pink Pearl Rose",         price:139, color:["pink"],        shape:["rose"],    mood:["romantic"]},
  {n:28, ar:"المربع الأزرق",           en:"Blue Square",             price:129, color:["blue"],        shape:["unique"],  mood:["calm"]}
];

const QUESTIONS = [
  { q:"إيه نوع بشرتك؟", qe:"What is your skin type?", opts:[
    ["💧","دهنية","Oily","oily"],["⚖️","مختلطة","Combination","combo"],["🙂","عادية","Normal","normal"],["🏜️","جافة","Dry","dry"],["🌸","حساسة","Sensitive","sensitive"]
  ]},
  { q:"روتين العناية ببشرتك عامل إزاي؟", qe:"What does your skincare routine look like?", opts:[
    ["🚫","مفيش روتين","No routine","none"],["🧼","بسيط (غسول بس)","Simple (cleanser only)","basic"],["🧴","متوسط (غسول + مرطب)","Medium (cleanser + moisturizer)","mid"],["✨","كامل (غسول + مرطب + واقي شمس/سيروم)","Full (cleanser + moisturizer + sunscreen/serum)","full"]
  ]},
  { q:"بتغسل وشك بالغسول كام مرة في الأسبوع؟", qe:"How often do you wash your face with cleanser?", opts:[
    ["1️⃣","مرة أو أقل","Once a week or less","w1"],["2️⃣","٢-٣ مرات","2-3 times a week","w3"],["📅","كل يوم مرة","Once a day","d1"],["🔁","كل يوم مرتين","Twice a day","d2"]
  ]},
  { q:"إيه أكتر حاجة عايز بشرتك تتحسن فيها؟", qe:"What do you most want to improve in your skin?", opts:[
    ["💦","ترطيب","Hydration","hydrate"],["🧽","تنضيف عميق وحبوب","Deep cleansing and blemishes","clean"],["🌟","نضارة وتفتيح","Glow and brightening","glow"],["🕊️","تهدئة وراحة","Soothing and comfort","soothe"]
  ]}
];

const TX = {
  ar:{title:"أي صابونة فرعونية تشبهك؟ | LUMIERA",quizTitle:"أي صابونة فرعونية تشبهك؟ 🏺",sub:"جاوب 4 أسئلة عن بشرتك وروتينك، وهنرشحلك الصابونة المناسبة ليك من مجموعة لوميرا، بصورتها وسعرها بعرض الوايت فرايداي.",start:"ابدأ الاختبار",step:function(i,n){return "سؤال "+(i+1)+" من "+n;},badge:"صابونتك طلعت",cur:"جنيه",wfNote:"سعر الوايت فرايداي بعد خصم 10% 🎉",order:"اطلبها على واتساب",again:"العب تاني",hint:"شارك الاختبار مع صحابك وشوف صابونتهم إيه ✨",back:"← شوف كل منتجات لوميرا",toggle:"English",alt:"شعار لوميرا",wa:function(n){return "مرحبًا، لعبت اختبار «أي صابونة فرعونية تشبهك؟» على موقع لوميرا وطلعتلي: "+n+" 🧼 عايز أطلبها بعرض الوايت فرايداي.";}},
  en:{title:"Which Pharaonic soap matches you? | LUMIERA",quizTitle:"Which Pharaonic soap matches you? 🏺",sub:"Answer 4 questions about your skin and routine, and we will recommend the right soap from the LUMIERA collection, with its photo and White Friday price.",start:"Start the quiz",step:function(i,n){return "Question "+(i+1)+" of "+n;},badge:"YOUR SOAP",cur:"EGP",wfNote:"White Friday price after 10% off 🎉",order:"Order on WhatsApp",again:"Play again",hint:"Share the quiz with your friends and see which soap they get ✨",back:"← See all LUMIERA products",toggle:"عربي",alt:"LUMIERA logo",wa:function(n){return "Hi, I took the \"Which Pharaonic soap matches you?\" quiz on the LUMIERA website and got: "+n+" 🧼 I want to order it with the White Friday offer.";}}
};
function LG(){try{return localStorage.getItem("lum-lang")==="en"?"en":"ar";}catch(e){return "ar";}}
function T(){return TX[LG()];}
function pname(p){return LG()==="en"?p.en:p.ar;}

// answer -> mood/color tags it favours (recommendation by look and feel, not medical claims)
const MAPS = {
  oily:{mood:["night","nature"],color:["dark","green"]},
  combo:{mood:["nature","calm"],color:["blue","green"]},
  normal:{mood:["romantic","royal"],color:["pink","gold"]},
  dry:{mood:["calm"],color:["pearl","pink"]},
  sensitive:{mood:["calm","romantic"],color:["pearl","pink"]},
  none:{mood:["calm"],color:["pearl"]},
  basic:{mood:["nature"],color:["green","blue"]},
  mid:{mood:["romantic"],color:["pink"]},
  full:{mood:["royal"],color:["gold"]},
  w1:{mood:["calm"],color:["pearl"]},
  w3:{mood:["nature"],color:["blue"]},
  d1:{mood:["romantic"],color:["pink"]},
  d2:{mood:["night"],color:["dark"]},
  hydrate:{mood:["calm"],color:["pearl","blue"]},
  clean:{mood:["night","nature"],color:["dark","green"]},
  glow:{mood:["royal"],color:["gold"]},
  soothe:{mood:["calm","romantic"],color:["pearl","pink"]}
};

const app = document.getElementById("app");
let answers = [];

function el(html){ const d=document.createElement("div"); d.innerHTML=html.trim(); return d.firstChild; }

function score(){
  const s = PRODUCTS.map(()=>0);
  answers.forEach((val)=>{
    const m = MAPS[val]||{mood:[],color:[]};
    PRODUCTS.forEach((p,k)=>{
      m.mood.forEach(t=>{ if(p.mood.includes(t)) s[k]+=2; });
      m.color.forEach(t=>{ if(p.color.includes(t)) s[k]+=1; });
    });
  });
  const best = Math.max(...s);
  const tied = s.map((v,k)=>v===best?k:-1).filter(k=>k>=0);
  const h = answers.join("|").split("").reduce((a,c)=>a+c.charCodeAt(0),0);
  return PRODUCTS[tied[h % tied.length]];
}


var view={name:"intro",i:0,n:0};
function resultHTML(p){
  var t=T(),wf=Math.round(p.price*0.9),nm=pname(p),sec=LG()==="en"?p.ar:p.en;
  var msg=t.wa(nm);
  return `
    <div class="result fade">
      <span class="result-badge">${t.badge}</span>
      <div class="result-title">${nm}</div>
      <div class="result-en">${sec}</div>
      <img class="result-photo" src="./assets/ai-${String(p.n).padStart(2,"0")}-1.jpg" alt="${nm}" />
      <div class="price"><span class="price-old">${p.price} ${t.cur}</span><span class="price-new">${wf} ${t.cur}</span></div>
      <div class="wf-note">${t.wfNote}</div>
      <div class="result-actions">
        <a class="btn-gold" id="wa" href="${WA}${encodeURIComponent(msg)}" target="_blank" rel="noopener">${t.order}</a>
        <button class="btn-outline" id="again">${t.again}</button>
      </div>
      <div class="share-hint">${t.hint}</div>
    </div>`;
}
function showIntro(){
  view={name:"intro"};var t=T();
  app.innerHTML = "";
  app.appendChild(el(`
    <div class="qcard fade">
      <div class="quiz-title">${t.quizTitle}</div>
      <div class="quiz-sub">${t.sub}</div>
      <button class="btn-gold" id="start">${t.start}</button>
    </div>`));
  document.getElementById("start").onclick = ()=>{ answers=[]; showQuestion(0); };
}
function showQuestion(i){
  view={name:"q",i:i};
  var t=T(),en=LG()==="en",q=QUESTIONS[i];
  app.innerHTML = "";
  const dots = QUESTIONS.map((_,k)=>`<div class="dot${k<=i?" on":""}"></div>`).join("");
  const card = el(`
    <div class="qcard fade">
      <div class="qstep">${t.step(i,QUESTIONS.length)}</div>
      <div class="qtext">${en?q.qe:q.q}</div>
    </div>`);
  q.opts.forEach(([emo,ar,e,val])=>{
    const b = el(`<button class="opt"><span class="emo">${emo}</span>${en?e:ar}</button>`);
    b.onclick = ()=>{ answers[i]=val; if(i+1<QUESTIONS.length) showQuestion(i+1); else showResult(); };
    card.appendChild(b);
  });
  app.appendChild(el(`<div class="progress">${dots}</div>`));
  app.appendChild(card);
}
function drawResult(p){
  var t=T();
  app.innerHTML = "";
  app.appendChild(el(resultHTML(p)));
  document.getElementById("again").onclick = showIntro;
  app.appendChild(el(`<div style="text-align:center"><a class="back-link" href="./index.html">${t.back}</a></div>`));
}
function showResult(){ var p=score(); view={name:"r",n:p.n}; drawResult(p); }
function applyLang(){
  var en=LG()==="en",t=T();
  document.documentElement.lang=en?"en":"ar";
  document.documentElement.dir=en?"ltr":"rtl";
  document.title=t.title;
  document.getElementById("langbtn").textContent=t.toggle;
  document.getElementById("emblem").alt=t.alt;
  if(view.name==="q") showQuestion(view.i);
  else if(view.name==="r") drawResult(PRODUCTS.find(x=>x.n===view.n));
  else showIntro();
}
document.getElementById("langbtn").onclick=function(){
  try{localStorage.setItem("lum-lang",LG()==="en"?"ar":"en");}catch(e){}
  applyLang();
};

// preview helper: open a specific result directly (used for design review)
const m = location.hash.match(/^#result-(\d+)$/);
if(m){
  const n = Math.max(1, Math.min(28, parseInt(m[1],10)));
  answers = [];
  view={name:"r",n:n};
  applyLang();
} else {
  applyLang();
}
</script>
